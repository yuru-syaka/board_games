# ゲームのルール（shared/）と対戦サーバー（server/）のテストを、push のたびに Linux で実行する。
#
# - shared/dotnet … 6 本のルールのテスト（Unity の EditMode テストと同じファイル）
# - server/        … 対戦サーバーの中身のテスト（AWS の代わりにメモリ上の保存先を使う）
# - 手元の Windows では、Smart App Control がビルドしたばかりの DLL を止めることがあり、
#   dotnet test が実行できない場合がある。ここ（Linux）なら必ず実行できるので、テストの正本はこちら。
# - AWS には接続しない（シークレットも使わない）。

name: Test

on:
  push:
    branches: [main]
    paths: ["shared/**", "server/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["shared/**", "server/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the game rules (shared)
        run: dotnet test shared/dotnet/BoardGames.Shared.slnx -c Release

      - name: Test the game server (server)
        run: dotnet test server/BoardGames.Server.slnx -c Release
