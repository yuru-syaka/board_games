<!DOCTYPE html>
<!--
  =======================================================================
  このファイルの説明
  -----------------------------------------------------------------------
  見つからないページ（404）。存在しない URL を開いたときに CloudFront が返す
  （infra/lib/web-stack.ts の errorResponses。ステータスは 404 のまま）。
  - どの深さの URL でも同じ内容が返るので、CSS・画像・リンクは「/」から始まる形で書く。
  - 検索結果に出さない（noindex）。sitemap.xml にも載せない（scripts/generate-sitemap.js で除外）。
  - 広告は入れない（中身のないページに広告を出さないため）。

  共通の決まりごと:
  - 見た目は css/style.css（共通）と css/page.css（サブページ）で決める。
  - 公開: git push で GitHub Actions が WebStack をデプロイする。
  =======================================================================
-->
<html lang="ja">
<head>
  <!-- 文字コード（日本語を正しく表示するため UTF-8） -->
  <meta charset="UTF-8" />
  <!-- スマートフォンでは画面の幅に合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ページが見つかりません - BOARD PIA</title>
  <!-- 検索結果に出さない -->
  <meta name="robots" content="noindex" />

  <!-- ファビコン（タブのアイコン）と、iPhone でホーム画面に追加したときのアイコン -->
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

  <!-- Google Fonts（英字ロゴの Orbitron と、日本語の M PLUS Rounded 1c）。preconnect で先に接続して表示を速くする -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&amp;family=M+PLUS+Rounded+1c:wght@400;700&amp;display=swap" rel="stylesheet" />
  <!-- サイト共通のスタイル（style.css）と、サブページ用のスタイル（page.css） -->
  <link href="/css/style.css" rel="stylesheet" />
  <link href="/css/page.css" rel="stylesheet" />
  <!-- ログイン（ステップ 5）。auth-config.js はデプロイのときに書き出される。ヘッダーに「ログイン / ログアウト」を出す -->
  <script src="/js/auth-config.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <!-- 上部のナビゲーション（左：トップへ戻るロゴ、右：メニュー） -->
  <nav class="site-nav">
    <a class="brand" href="/">BOARD PIA</a>
    <ul>
      <li><a href="/">ゲーム</a></li>
      <li><a href="/blog/">開発日記</a></li>
    </ul>
  </nav>

  <!-- ページ本体 -->
  <main class="page">
    <p class="breadcrumb"><a href="/">ホーム</a> ＞ ページが見つかりません</p>

    <h1 class="page-title">ページが見つかりません</h1>

    <article class="prose">
      <p>
        お探しのページは、移動または削除されたか、URL が間違っている可能性があります。
        下のリンクから目的のページを探してみてください。
      </p>

      <h2>ゲーム</h2>
      <ul>
        <li><a href="/games/ghost-tic-tac-toe.html">ゴースト・マルバツゲーム</a></li>
        <li><a href="/games/ghost-gobble.html">ゴースト・ゴブル</a></li>
        <li><a href="/games/ghost-bluff.html">ゴースト・ブラフ</a></li>
        <li><a href="/games/ghost-quarto.html">ゴースト・クアルト</a></li>
        <li><a href="/games/ghost-line.html">ゴースト・ライン</a></li>
        <li><a href="/games/century-ghost.html">センチュリー・ゴースト</a></li>
      </ul>

      <h2>そのほか</h2>
      <ul>
        <li><a href="/">トップページ</a></li>
        <li><a href="/blog/">開発日記</a></li>
        <li><a href="/contact.html">お問い合わせ</a></li>
      </ul>
    </article>
  </main>

  <!-- フッター：プライバシーポリシー・お問い合わせへのリンクと、コピーライト -->
  <footer>
    <nav class="footer-links"><a href="/privacy.html">プライバシーポリシー</a><a href="/contact.html">お問い合わせ</a></nav>
    &copy; 2026 ゆるめの社会人
  </footer>
</body>
</html>
