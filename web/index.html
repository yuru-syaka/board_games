<!DOCTYPE html>
<!--
  =======================================================================
  このファイルの説明
  -----------------------------------------------------------------------
  トップページ（https://boardgamepia.com/）
  - ロゴ、サブタイトル、ゲーム一覧のカードを表示する。
  - ゲーム一覧の中身は js/script.js が games 配列から作る。
    ゲームを追加・変更するときは、この HTML ではなく script.js を編集する。

  共通の決まりごと:
  - 見た目は css/style.css（共通）と css/page.css（サブページ）で決める。
  - 公開: infra フォルダで cdk deploy WebStack を実行すると S3 にアップロードされ、
    CloudFront のキャッシュも消えて boardgamepia.com に反映される。
  =======================================================================
-->
<html lang="ja">
<head>
  <!-- 文字コード（日本語を正しく表示するため UTF-8） -->
  <meta charset="UTF-8" />
  <!-- スマートフォンでは画面の幅に合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ページのタイトル（ブラウザのタブと検索結果に出る）と、説明文（検索結果の説明に使われる） -->
  <title>ボードゲーム作品集</title>
  <meta name="description" content="おばけたちのボードゲーム作品集。インストール不要、ブラウザですぐに遊べます。CPU対戦・オンライン対戦に対応。" />

  <!-- ファビコン（タブのアイコン）と、iPhone でホーム画面に追加したときのアイコン -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

  <!-- OGP：SNS で URL がシェアされたときのカード（タイトル・説明・画像）。画像は images/ogp.png（1200×630） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BOARD PIA" />
  <meta property="og:title" content="ボードゲーム作品集" />
  <meta property="og:description" content="おばけたちのボードゲーム作品集。インストール不要、ブラウザですぐに遊べます。CPU対戦・オンライン対戦に対応。" />
  <meta property="og:url" content="https://boardgamepia.com/" />
  <meta property="og:image" content="https://boardgamepia.com/images/ogp.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Google Fonts（英字ロゴの Orbitron と、日本語の M PLUS Rounded 1c）。preconnect で先に接続して表示を速くする -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&amp;family=M+PLUS+Rounded+1c:wght@400;700&amp;display=swap" rel="stylesheet" />
  <!-- サイト共通のスタイル（style.css）と、サブページ用のスタイル（page.css） -->
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/page.css" rel="stylesheet" />
  <!-- ゲーム一覧のカードを作るスクリプト（defer：HTML を読み終わってから実行する） -->
  <script type="text/javascript" src="js/script.js" defer="defer"></script>
  <!-- Google AdSense：広告を表示するためのコード（ca-pub-… はサイト運営者 ID）。審査とサイトの確認にも使う。
       ゲームの邪魔にならないよう、プレイページ（play/）には入れていない -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9604866179636920"
       crossorigin="anonymous"></script>
  <!-- ログイン（ステップ 5）。auth-config.js はデプロイのときに書き出される。ヘッダーに「ログイン / マイページ」を出す -->
  <script src="/js/auth-config.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>

  <!-- ヘッダー：ロゴとサブタイトル -->
  <header>
    <h1 class="logo">BOARD PIA</h1>
    <p class="subtitle">ブラウザですぐ遊べる ボードゲーム作品集</p>
    <!-- 右上のリンク（ランキング。ログイン / マイページは js/auth.js が右に足す） -->
    <div class="header-auth"><a href="ranking/">ランキング</a></div>
  </header>

  <!-- ゲーム一覧。中身は js/script.js が games 配列から作るので、ここには何も書かない -->
  <main id="games"></main>

  <!-- オンライン対戦の案内（ステップ 6-4）。ゲームの一覧の下に置く -->
  <section class="online-guide" aria-labelledby="online-guide-title">
    <h2 id="online-guide-title">オンライン対戦で遊ぶ</h2>
    <div class="guide-grid">
      <div class="guide-item">
        <h3>だれかと対戦</h3>
        <p>各ゲームの「オンライン対戦」から、<strong>ランダムマッチ</strong>で空いている人と、<strong>ルームコード</strong>で友だちと遊べます。登録しなくても遊べます。</p>
      </div>
      <div class="guide-item">
        <h3>レートとランキング</h3>
        <p><a class="guide-login" href="mypage/">ログイン</a>してランダムマッチで遊ぶと、ゲームごとのレートが動き、<a href="ranking/">ランキング</a>に載ります。</p>
      </div>
      <div class="guide-item">
        <h3>通信が切れても安心</h3>
        <p>通信が切れても、90 秒のうちなら同じ対局に戻れます。1 手には制限時間があるので、相手を待たせ続けることもありません。</p>
      </div>
    </div>
  </section>

  <!-- フッター：プライバシーポリシー・お問い合わせへのリンクと、コピーライト -->
  <footer>
    <nav class="footer-links"><a href="./terms.html">利用規約</a><a href="./privacy.html">プライバシーポリシー</a><a href="./contact.html">お問い合わせ</a></nav>
    &copy; 2026 ゆるめの社会人
  </footer>
</body>
</html>
