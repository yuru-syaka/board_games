<!DOCTYPE html>
<!-- 通信できないときに Service Worker（/sw.js）が出すページ。単体で表示できるよう、CSS も画像もこの中に書く -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07060f" />
  <title>オフライン - BOARD PIA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #07060f; color: #e9e6ff; text-align: center;
      font-family: "Hiragino Maru Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
    main { max-width: 360px; }
    svg { width: 112px; height: 112px; filter: drop-shadow(0 0 10px #22f3ff); }
    h1 { font-size: 22px; margin: 18px 0 10px; }
    p { color: #b9b4dc; line-height: 1.8; margin: 0 0 24px; }
    button { min-height: 48px; padding: 0 28px; border: 2px solid #22f3ff; border-radius: 12px; background: transparent;
      color: #22f3ff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M17 50 V29 a15 15 0 0 1 30 0 V50 l-5 -4.5 -5 4.5 -5 -4.5 -5 4.5 -5 -4.5 z" stroke="#22f3ff" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="26.5" cy="30" r="3" fill="#fff" /><circle cx="37.5" cy="30" r="3" fill="#fff" />
    </svg>
    <h1>インターネットにつながっていません</h1>
    <p>BOARD PIA のゲームを遊ぶには通信が必要です。接続を確かめてから、もう一度お試しください。</p>

</html>
